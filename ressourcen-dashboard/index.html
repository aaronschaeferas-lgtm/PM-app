<title>SAP Projektradar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS grouped screen. Large-title nav bar, content cards on the grouped background, one card per job posting (all matching consultants bundled), floating Liquid-Glass tab bar for the four areas. Tokens: "Native iOS" design system. */
:root{
  --red:#ff383c; --orange:#ff8d28; --yellow:#ffcc00; --green:#34c759; --mint:#00c8b3; --teal:#00c3d0; --cyan:#00c0e8;
  --blue:#0088ff; --indigo:#6155f5; --purple:#cb30e0; --pink:#ff2d55; --brown:#ac7f5e;
  --blue-strong:#1e6ef4; --red-strong:#e9152d; --orange-strong:#c55300; --green-strong:#008932;
  --accent:var(--blue); --accent-strong:var(--blue-strong); --on-accent:#ffffff;
  --gray:#8e8e93; --gray2:#aeaeb2; --gray3:#c7c7cc; --gray4:#d1d1d6; --gray5:#e5e5ea; --gray6:#f2f2f7;
  --bg-primary:#ffffff; --bg-secondary:#f2f2f7; --bg-tertiary:#ffffff;
  --bg-grouped-primary:#f2f2f7; --bg-grouped-secondary:#ffffff; --bg-grouped-tertiary:#f2f2f7;
  --label:#000000; --label-secondary:rgba(60,60,67,.6); --label-tertiary:rgba(60,60,67,.3);
  --fill:rgba(120,120,128,.2); --fill-secondary:rgba(120,120,128,.16); --fill-tertiary:rgba(118,118,128,.12); --fill-quaternary:rgba(116,116,128,.08);
  --separator:rgba(60,60,67,.29);
  --glass-regular:rgba(255,255,255,.72); --glass-stroke:rgba(255,255,255,.8);
  --shadow-glass:0 8px 32px rgba(0,0,0,.12); --shadow-thumb:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --tint-blue:color-mix(in srgb,var(--blue) 13%,transparent); --tint-green:color-mix(in srgb,var(--green) 15%,transparent);
  --tint-orange:color-mix(in srgb,var(--orange) 15%,transparent); --tint-red:color-mix(in srgb,var(--red) 12%,transparent);
  --tint-indigo:color-mix(in srgb,var(--indigo) 13%,transparent);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --font-rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --radius-xs:7px; --radius-sm:10px; --radius-md:16px; --radius-lg:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#ff4245; --orange:#ff9230; --yellow:#ffd600; --green:#30d158; --mint:#00dac3; --teal:#00d2e0; --cyan:#3cd3fe;
  --blue:#0091ff; --indigo:#6d7cff; --purple:#db34f2; --pink:#ff375f; --brown:#b78a66;
  --blue-strong:#0091ff; --red-strong:#ff4245; --orange-strong:#ff9230; --green-strong:#30d158;
  --gray2:#636366; --gray3:#48484a; --gray4:#3a3a3c; --gray5:#2c2c2e; --gray6:#1c1c1e;
  --bg-primary:#000000; --bg-secondary:#1c1c1e; --bg-tertiary:#2c2c2e;
  --bg-grouped-primary:#000000; --bg-grouped-secondary:#1c1c1e; --bg-grouped-tertiary:#2c2c2e;
  --label:#ffffff; --label-secondary:rgba(235,235,245,.6); --label-tertiary:rgba(235,235,245,.3);
  --fill:rgba(120,120,128,.36); --fill-secondary:rgba(120,120,128,.32); --fill-tertiary:rgba(118,118,128,.24); --fill-quaternary:rgba(118,118,128,.18);
  --separator:rgba(84,84,88,.65);
  --glass-regular:rgba(40,40,44,.62); --glass-stroke:rgba(255,255,255,.14); --shadow-glass:0 8px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --red:#ff4245; --orange:#ff9230; --yellow:#ffd600; --green:#30d158; --mint:#00dac3; --teal:#00d2e0; --cyan:#3cd3fe;
  --blue:#0091ff; --indigo:#6d7cff; --purple:#db34f2; --pink:#ff375f; --brown:#b78a66;
  --blue-strong:#0091ff; --red-strong:#ff4245; --orange-strong:#ff9230; --green-strong:#30d158;
  --gray2:#636366; --gray3:#48484a; --gray4:#3a3a3c; --gray5:#2c2c2e; --gray6:#1c1c1e;
  --bg-primary:#000000; --bg-secondary:#1c1c1e; --bg-tertiary:#2c2c2e;
  --bg-grouped-primary:#000000; --bg-grouped-secondary:#1c1c1e; --bg-grouped-tertiary:#2c2c2e;
  --label:#ffffff; --label-secondary:rgba(235,235,245,.6); --label-tertiary:rgba(235,235,245,.3);
  --fill:rgba(120,120,128,.36); --fill-secondary:rgba(120,120,128,.32); --fill-tertiary:rgba(118,118,128,.24); --fill-quaternary:rgba(118,118,128,.18);
  --separator:rgba(84,84,88,.65);
  --glass-regular:rgba(40,40,44,.62); --glass-stroke:rgba(255,255,255,.14); --shadow-glass:0 8px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg-grouped-primary);color:var(--label);font:400 17px/22px var(--font-sans);letter-spacing:-.43px;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent-strong)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:1272px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(124px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.app{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}
.ic{width:20px;height:20px;flex:none}
.mono{font-family:var(--font-mono);font-size:.9em;letter-spacing:0}
.muted{color:var(--label-secondary)}
.title2{font:700 22px/28px var(--font-sans);letter-spacing:-.26px}
.title3{font:600 20px/25px var(--font-sans);letter-spacing:-.45px}
.sec-hdr{margin:0 0 6px;font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary);text-transform:uppercase}
.hint{font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary);max-width:68ch}
.stack{display:grid;gap:12px;min-width:0}

/* navigation bar */
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:16px 20px}
.nav .eyebrow{margin:0 0 2px;font:600 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary);text-transform:uppercase}
.nav h1{font:700 34px/41px var(--font-sans);letter-spacing:.4px}
.glass{background:var(--glass-regular);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 1px var(--glass-stroke),var(--shadow-glass)}
.glassbtn{width:44px;height:44px;border-radius:999px;border:0;display:grid;place-items:center;color:var(--label);cursor:pointer;flex:none}
.glassbtn .ic{width:22px;height:22px}

/* tab bar */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));height:62px;padding:4px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:999px}
.tabbar button{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--label);font:600 10px/12px var(--font-sans);letter-spacing:0;border-radius:999px;cursor:pointer;min-width:0}
.tabbar button[aria-current="page"]{color:var(--accent-strong);background:var(--fill-tertiary)}
.tabbar .ic{width:24px;height:24px}
.tabbar .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red-strong);color:var(--on-accent);font:600 11px/18px var(--font-sans);text-align:center}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 14px;border:0;border-radius:999px;font:600 15px/20px var(--font-sans);letter-spacing:-.23px;cursor:pointer;text-decoration:none;white-space:nowrap;max-width:100%}
.btn::before{content:"";position:absolute;inset:-5px 0}
.btn > span{overflow:hidden;text-overflow:ellipsis}
.btn .ic{width:18px;height:18px}
.btn.lg{min-height:50px;padding:0 24px;font-size:17px;line-height:22px;letter-spacing:-.43px}
.btn.prominent{background:var(--accent-strong);color:var(--on-accent)}
.btn.bordered{background:var(--fill-tertiary);color:var(--accent-strong)}
.btn.plain{background:transparent;color:var(--accent-strong);font-weight:400;padding:0 8px}
.btn.xs{min-height:28px;padding:0 6px;font-size:13px;line-height:18px;letter-spacing:-.08px}
.btn.xs .ic{width:15px;height:15px}
.btn.destructive{color:var(--red-strong)}
.btn:disabled{opacity:.4;cursor:default}
@media (hover:hover){.btn.prominent:hover{filter:brightness(1.08)}.btn.bordered:hover{background:var(--fill-secondary)}}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* chips & pills */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:2px 9px;border-radius:999px;background:var(--fill-tertiary);color:var(--label);font:400 13px/18px var(--font-sans);letter-spacing:-.08px;white-space:nowrap}
.chip .ic{width:14px;height:14px}
.t-blue{color:var(--blue-strong)} .t-green{color:var(--green-strong)} .t-orange{color:var(--orange-strong)} .t-red{color:var(--red-strong)} .t-indigo{color:var(--indigo)}
.chip.t-blue{background:var(--tint-blue);font-weight:600} .chip.t-green{background:var(--tint-green);font-weight:600}
.chip.t-orange{background:var(--tint-orange);font-weight:600} .chip.t-red{background:var(--tint-red);font-weight:600} .chip.t-indigo{background:var(--tint-indigo);font-weight:600}
.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;background:var(--tint-orange);color:var(--orange-strong);font:600 11px/16px var(--font-sans);letter-spacing:.06px;text-transform:uppercase}
.score-pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:1px 7px;border-radius:999px;font:700 13px/18px var(--font-rounded);font-variant-numeric:tabular-nums;letter-spacing:0}
.score-pill.tone-good{background:var(--tint-green);color:var(--green-strong)}
.score-pill.tone-mid{background:var(--tint-blue);color:var(--blue-strong)}
.score-pill.tone-low{background:var(--tint-orange);color:var(--orange-strong)}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;flex:none;background:color-mix(in srgb,var(--av) 24%,var(--bg-grouped-secondary));color:var(--label);font:600 11px/1 var(--font-sans);letter-spacing:0}
.av.lg{width:56px;height:56px;font-size:21px}

/* score ring */
.ring{position:relative;width:52px;height:52px;flex:none;--tone:var(--orange-strong)}
.ring.tone-good{--tone:var(--green-strong)} .ring.tone-mid{--tone:var(--blue-strong)}
.ring svg{display:block;width:100%;height:100%}
.ring .trk{fill:none;stroke:var(--fill);stroke-width:5}
.ring .val{fill:none;stroke:var(--tone);stroke-width:5;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 15px/1 var(--font-rounded);font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--tone)}
.ring.sm{width:40px;height:40px}
.ring.sm span{font-size:13px}

/* status menu */
.st{position:relative;display:inline-flex;border-radius:999px;background:var(--st-bg,var(--fill-tertiary));color:var(--st-fg,var(--label))}
.st select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font:600 13px/18px var(--font-sans);letter-spacing:-.08px;padding:7px 28px 7px 12px;border-radius:999px;cursor:pointer}
.st select:disabled{cursor:default}
.st::after{content:"";position:absolute;right:12px;top:50%;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.st option{background:var(--bg-tertiary);color:var(--label)}
.st[data-st="vorgemerkt"]{--st-bg:var(--tint-indigo);--st-fg:var(--indigo)}
.st[data-st="gesendet"]{--st-bg:var(--accent-strong);--st-fg:var(--on-accent)}
.st[data-st="gespraech"]{--st-bg:var(--tint-orange);--st-fg:var(--orange-strong)}
.st[data-st="zusage"]{--st-bg:var(--tint-green);--st-fg:var(--green-strong)}
.st[data-st="verworfen"]{--st-bg:var(--tint-red);--st-fg:var(--red-strong)}
.st[data-st="anrede-offen"]{--st-bg:var(--tint-orange);--st-fg:var(--orange-strong)}

/* cards */
.card{background:var(--bg-grouped-secondary);border-radius:var(--radius-lg);padding:16px;min-width:0}
.k-head{display:flex;align-items:center;gap:6px;font:600 15px/20px var(--font-sans);letter-spacing:-.23px}
.k-head .ic{width:18px;height:18px}
.metric{font:700 28px/32px var(--font-rounded);font-variant-numeric:tabular-nums;letter-spacing:0}
.metric-xl{font:700 48px/52px var(--font-rounded);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.note{font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kcard{position:relative;display:flex;flex-direction:column;gap:8px;border:0;text-align:left;cursor:pointer;color:inherit}
.kcard .chev{position:absolute;top:16px;right:14px;width:16px;height:16px;color:var(--gray3)}
.kcard[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
@media (hover:hover){.kcard:hover .chev{color:var(--label-secondary)}}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--tint-orange);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:16px;font:400 15px/20px var(--font-sans);letter-spacing:-.23px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1 1 260px;min-width:0}
.search input{width:100%;height:36px;border:0;border-radius:var(--radius-sm);background:var(--fill-tertiary);padding:0 12px 0 34px;font-size:17px}
.search input::placeholder{color:var(--label-secondary)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--label-secondary)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,auto);padding:3px;gap:2px;background:var(--fill-tertiary);border-radius:999px;max-width:100%}
.seg button{border:0;background:transparent;color:var(--label);font:400 15px/20px var(--font-sans);letter-spacing:-.23px;min-height:32px;padding:0 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bg-tertiary);font-weight:600;box-shadow:var(--shadow-thumb)}
@media (max-width:560px){.toolbar .seg{width:100%;grid-auto-columns:minmax(0,1fr)}.seg button{padding:0 6px}}
.menus{display:flex;flex-wrap:wrap;gap:8px}
.menu{position:relative;display:inline-flex}
.menu select{appearance:none;-webkit-appearance:none;height:34px;border:0;border-radius:999px;background:var(--fill-tertiary);color:var(--accent-strong);font:400 15px/20px var(--font-sans);letter-spacing:-.23px;padding:0 30px 0 14px;cursor:pointer;max-width:100%}
.menu::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--accent-strong);border-bottom:1.5px solid var(--accent-strong);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.menu option{background:var(--bg-tertiary);color:var(--label)}
.list-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 12px;margin:0 4px 10px}
.count-line{font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary);font-variant-numeric:tabular-nums}

/* job posting card */
.cards{display:grid;gap:12px}
.gcard{background:var(--bg-grouped-secondary);border-radius:var(--radius-lg);padding:16px;display:grid;gap:14px;scroll-margin-top:16px;min-width:0}
.gcard.is-out .g-title{color:var(--label-secondary);text-decoration:line-through}
.g-head{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:start}
.g-title{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:600 17px/22px var(--font-sans);letter-spacing:-.43px;color:var(--label);display:inline-flex;gap:4px;align-items:flex-start}
.g-title .ic{width:18px;height:18px;margin-top:2px;color:var(--gray3);transition:transform .2s}
.g-title[aria-expanded="true"] .ic{transform:rotate(90deg)}
@media (hover:hover){.g-title:hover{color:var(--accent-strong)}}
.g-sub{margin:2px 0 8px;font:400 15px/20px var(--font-sans);letter-spacing:-.23px;color:var(--label-secondary)}
.g-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pub{font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary);white-space:nowrap}
.g-fit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-left:66px}
.fit-label{font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary)}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 10px 3px 3px;border:0;border-radius:999px;background:var(--fill-quaternary);cursor:pointer;font:400 15px/20px var(--font-sans);letter-spacing:-.23px;color:var(--label)}
.pchip .score-pill{min-width:0;padding:0 2px;background:none}
.pchip .ic{width:14px;height:14px;color:var(--green-strong)}
@media (hover:hover){.pchip:hover{background:var(--fill-tertiary)}}
.multi{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--tint-indigo);color:var(--indigo);font:600 13px/18px var(--font-sans);letter-spacing:-.08px}
.multi .ic{width:16px;height:16px}
.g-contact{background:var(--bg-grouped-tertiary);border-radius:var(--radius-sm);padding:10px 12px 10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.who{display:grid;gap:1px;min-width:0}
.who-n{font:600 15px/20px var(--font-sans);letter-spacing:-.23px;overflow-wrap:anywhere}
.who-d{font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary);overflow-wrap:anywhere}
.g-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;min-width:0}
.nextstep{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 12px;border-radius:var(--radius-sm);background:var(--tint-blue);font:400 15px/20px var(--font-sans);letter-spacing:-.23px}
@media (max-width:640px){
  .g-head{grid-template-columns:52px minmax(0,1fr);gap:12px}
  .g-side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .g-fit{padding-left:0}
  .g-actions{justify-content:flex-start}
}

/* composer */
.composer{background:var(--bg-grouped-tertiary);border-radius:var(--radius-sm);padding:14px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:18px}
@media (max-width:820px){.composer{grid-template-columns:minmax(0,1fr)}}
.ilist{list-style:none;margin:0;padding:0;background:var(--bg-grouped-secondary);border-radius:var(--radius-sm);overflow:hidden}
.ilist > li{position:relative}
.ilist > li + li::before{content:"";position:absolute;top:0;left:var(--sep,16px);right:0;height:.5px;background:var(--separator)}
.crow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;cursor:pointer}
.ilist.cands{--sep:50px}
.crow input{position:absolute;opacity:0;pointer-events:none}
.crow-main{flex:1;min-width:0;display:grid}
.crow-t{font:400 17px/22px var(--font-sans)}
.crow-s{font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary)}
.tick{width:22px;height:22px;color:var(--accent-strong);opacity:0}
.tick .ic{width:22px;height:22px}
.crow input:checked ~ .tick{opacity:1}
.crow:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:-3px;border-radius:var(--radius-sm)}
.mf{display:grid;gap:4px;min-width:0}
.mf-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mf-h > span{font:400 13px/18px var(--font-sans);letter-spacing:-.08px;color:var(--label-secondary);text-transform:uppercase}
.mf pre{margin:0;background:var(--bg-grouped-secondary);border-radius:var(--radius-sm);padding:10px 12px;font:400 15px/21px var(--font-sans);letter-spacing:-.23px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}

/* details */

  const v = run && run.berater && run.berater.verfuegbarAb;
  const av = /sofort|asap|ab sofort/i.test(String(v || "")) ? today() : parseDate(v);
  if (!av) return null;

  if (st) return (av - st) / DAY > 14 ? { ok: false, text: `Start ${fmtDate(st)} vor Verfügbarkeit` } : { ok: true, text: "Start passt" };
  if (asap) return (av - today()) / DAY > 14 ? { ok: false, text: `ASAP-Start, verfügbar erst ${fmtDate(av)}` } : { ok: true, text: "ASAP passt" };

function projText(p, o) {
  const link = safeUrl(p.link) || "Link fehlt";

  if (meta) lines.push(meta);

  lines.push(`Ort: ${[p.einsatzort, ortHasRemote ? null : r === null ? "Remote-Anteil nicht genannt" : `${r} % remote`].filter(Boolean).join(" · ")}`);

function summaryCards(run, items) {

function runText(run, list, o) {

}

/* ---------- actions ---------- */
const writeChains = {};
function saveStatus(sid, patch) {
  const cur = state.status[sid] || {};
  const body = { ...cur, status: cur.status || "neu", notiz: cur.notiz || "", ...patch, geaendertAm: new Date().toISOString() };
  state.status[sid] = body;
  writeChains[sid] = (writeChains[sid] || Promise.resolve())
    .then(() => state.db.doc("status/" + sid).set(body))
    .catch((e) => { toast(dbErrorText(e)); if (e && e.code === "invalid_argument") { state.canWrite = false; render(); } });
  return writeChains[sid];
}
function markSent(sid) {
  const g = groups().map.get(sid); if (!g || !can()) return;
  const names = selOf(g).map((b) => b.name);
  const cur = state.status[sid] || {};
  const st = OFFEN.includes(stOf(sid)) ? "gesendet" : stOf(sid);
  saveStatus(sid, { status: st, angeboten: [...new Set([...arr(cur.angeboten), ...names])], gesendetAm: new Date().toISOString() });
  state.mailed.delete(sid);
  toast(`Profil gesendet: ${joinNames(names)}`);
  render();
}
function revealText(sid) {
  state.comp.add(sid); state.mailed.add(sid); render();
  const el = document.getElementById("mt-tx-" + sid);
  if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  toast("Text ist markiert. Mit Strg+C kopieren.");
}
function copyOffer(sid) {
  const g = groups().map.get(sid); if (!g) return;
  const m = mailFor(g); if (!m.n) return;
  try {
    navigator.clipboard.writeText(m.body).then(() => { state.mailed.add(sid); render(); toast("Angebotstext kopiert"); }, () => revealText(sid));
  } catch (e) { revealText(sid); }
}
async function copyFrom(btn) {
  const el = document.getElementById(btn.dataset.target); if (!el) return;
  const text = el.textContent; const html = btn.innerHTML;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Kopiert"; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = "Markiert, jetzt Strg+C";
  }
  setTimeout(() => { btn.innerHTML = html; }, 1800);
}

async function deleteRuns(ids, label) {
  if (!state.db || state.busy) return;
  const idset = new Set(ids);
  const affected = new Set(state.projects.filter((p) => idset.has(p.rechercheId)).map((p) => P2S.get(p.id)).filter(Boolean));
  const orphaned = [...affected].filter((sid) => { const g = groups().map.get(sid); return !g || g.items.every((it) => idset.has(it.run.id)); });
  state.busy = true; render();
  try {
    for (const p of state.projects.filter((x) => idset.has(x.rechercheId))) await state.db.doc("projekte/" + p.id).delete();
    for (const sid of orphaned) if (state.status[sid]) await state.db.doc("status/" + sid).delete();
    for (const id of ids) await state.db.doc("recherchen/" + id).delete();
    state.confirmDel = null; state.confirmDemo = false;
    if (idset.has(state.runId)) state.runId = null;
    toast(label);
  } catch (e) { toast(dbErrorText(e)); }
  state.busy = false; persist(); render();
}
function localStamp(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
async function doImport() {
  if (!state.db || state.busy) return;
  const fail = (text) => { state.importMsg = { kind: "err", text }; render(); };
  const raw = state.importText.trim();
  const a = raw.indexOf("{"), b = raw.lastIndexOf("}");
  if (a < 0 || b < a) return fail("Kein JSON gefunden. Füge den kompletten Block ein, der mit { beginnt.");
  let obj;
  try { obj = JSON.parse(raw.slice(a, b + 1)); } catch (e) { return fail("Das JSON ist nicht lesbar: " + e.message); }
  let rec = obj.recherche || (obj.berater ? obj : null);
  const projs = arr(obj.projekte || (rec && rec.projekte)).filter((p) => p && typeof p === "object");
  if (!rec || !rec.berater || !rec.berater.name) return fail('Es fehlt "recherche.berater.name".');
  rec = { ...rec }; delete rec.projekte;
  const created = rec.erstelltAm && !isNaN(Date.parse(rec.erstelltAm)) ? new Date(rec.erstelltAm) : new Date();
  const runId = cleanId(rec.id) || `${localStamp(new Date())}_${slug(rec.berater.name)}`;
  const ids = projs.map((p, i) => cleanId(p.id) || `${runId}__${String(i + 1).padStart(2, "0")}`);
  const byNr = new Map(projs.map((p, i) => [String(p.nr ?? i + 1), ids[i]]));
  const byTitle = new Map(projs.map((p, i) => [String(p.titel || "").trim().toLowerCase(), ids[i]]));
  const ref = (x) => { const s = String(x).trim(); if (/^\d+$/.test(s)) return byNr.get(s) ?? s; return byTitle.get(s.toLowerCase()) ?? s; };
  const z = rec.zusammenfassung || {};
  const runBody = clone({ ...rec, id: undefined, erstelltAm: created.toISOString(), zusammenfassung: { ...z, top3: arr(z.top3).map(ref), hoheErfolgswahrscheinlichkeit: arr(z.hoheErfolgswahrscheinlichkeit).map(ref) } });
  state.busy = true; state.importMsg = null; render();
  try {
    for (let i = 0; i < projs.length; i++) await state.db.doc("projekte/" + ids[i]).set(clone({ ...projs[i], id: undefined, nr: undefined, rechercheId: runId }));
    await state.db.doc("recherchen/" + runId).set(runBody);
    state.importText = "";
    state.importMsg = { kind: "ok", text: `Importiert: ${rec.berater.name}, ${projs.length} Projekte.` };
    state.runId = runId; persist();
    toast(`Recherche für ${rec.berater.name} importiert`);
  } catch (e) { state.importMsg = { kind: "err", text: dbErrorText(e) }; }
  state.busy = false; render();
}
async function saveMailTpl() {
  if (!state.db || !state.mvDraft) return;
  const body = { betreff: state.mvDraft.betreff, text: state.mvDraft.text, angebot: state.mvDraft.angebot, geaendertAm: new Date().toISOString() };
  try { await state.db.doc("meta/mailvorlage").set(body); state.mailTpl = body; state.mvDraft = null; toast("Mailvorlage gespeichert"); }
  catch (e) { toast(dbErrorText(e)); }
  render();
}
async function saveAbsender() {
  if (!state.db || !state.absDraft) return;
  const d = state.absDraft;
  const body = { name: String(d.name || "").trim(), firma: String(d.firma || "").trim(), telefon: String(d.telefon || "").trim(), email: String(d.email || "").trim(), geaendertAm: new Date().toISOString() };
  try { await state.db.doc("meta/absender").set(body); state.absender = body; state.absDraft = null; toast("Absender gespeichert"); }
  catch (e) { toast(dbErrorText(e)); }
  render();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "tab") { state.tab = b.dataset.tab; persist(); render(); window.scrollTo({ top: 0 }); }
  else if (act === "kpi") {
    if (b.dataset.v === "pipeline") { state.tab = "pipeline"; persist(); render(); window.scrollTo({ top: 0 }); }
    else { state.filters.seg = b.dataset.v; if (b.dataset.v !== "alle") state.filters.status = "aktiv"; persist(); render(); }
  }
  else if (act === "seg") { state.filters.seg = b.dataset.v; persist(); render(); }
  else if (act === "run") { state.runId = id; state.confirmDel = null; persist(); render(); }
  else if (act === "toggle") { state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); }
  else if (act === "comp") { state.comp.has(id) ? state.comp.delete(id) : state.comp.add(id); render(); }
  else if (act === "mail") {
    // Let the link open first; re-rendering now would detach it before the browser follows it.
    state.mailed.add(id); setTimeout(render, 0);
  }
  else if (act === "copy-offer") copyOffer(id);
  else if (act === "mark-sent") markSent(id);
  else if (act === "mailapp") { state.mailApp = b.dataset.v; persist(); render(); }
  else if (act === "copy") copyFrom(b);
  else if (act === "jump") { state.open.add(id); render(); scrollToId("g-" + id); }
  else if (act === "open-ov") openInOverview(id, "comp");
  else if (act === "goto-run") gotoRun(b.dataset.run);
  else if (act === "ptext") { state.ptext.has(id) ? state.ptext.delete(id) : state.ptext.add(id); render(); }
  else if (act === "save-note") {
    const text = state.drafts[id]; if (text === undefined) return;
    saveStatus(id, { notiz: text }).then(() => { if (state.drafts[id] === text) delete state.drafts[id]; toast("Notiz gespeichert"); render(); });
  }
  else if (act === "export-toggle") { state.exp.open = !state.exp.open; persist(); render(); }
  else if (act === "exfmt") { state.exp.fmt = b.dataset.v; persist(); render(); }
  else if (act === "del-ask") { state.confirmDel = id; render(); }
  else if (act === "del-cancel") { state.confirmDel = null; render(); }
  else if (act === "del-run") deleteRuns([id], "Recherche gelöscht");
  else if (act === "demo-ask") { state.confirmDemo = true; render(); }
  else if (act === "demo-cancel") { state.confirmDemo = false; render(); }
  else if (act === "demo-del") deleteRuns(state.runs.filter((r) => r.beispiel).map((r) => r.id), "Beispieldaten gelöscht");
  else if (act === "import") doImport();
  else if (act === "mv-save") saveMailTpl();
  else if (act === "mv-reset") { state.mvDraft = { ...DEFAULT_MAIL }; render(); }
  else if (act === "abs-save") saveAbsender();
  else if (act === "reset-filters") { Object.assign(state.filters, { q: "", seg: "alle", zeit: "alle", min: "0", remote: "alle", status: "aktiv" }); persist(); render(); }
  else if (act === "go-import" || act === "go-conn" || act === "go-demo") {
    state.tab = "einstellungen"; persist(); render();
    scrollToId(act === "go-import" ? "import" : act === "go-conn" ? "h-conn" : "demo");
    if (act === "go-import") { const t = document.getElementById("import-json"); if (t && !t.disabled) t.focus({ preventScroll: true }); }
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.filter) { state.filters[t.dataset.filter] = t.value; persist(); renderList(); }
  else if (t.dataset.sel) {
    const sid = t.dataset.sel; const g = groups().map.get(sid); if (!g) return;
    const s = new Set(state.sel[sid] || g.berater.map((b) => b.key));
    t.checked ? s.add(t.dataset.key) : s.delete(t.dataset.key);
    state.sel[sid] = s; render();
  }
  else if (t.dataset.statusFor) {
    saveStatus(t.dataset.statusFor, { status: t.value });
    toast(`Status: ${(STATUS.find((s) => s.k === t.value) || {}).l}`);
    render();
  }
  else if (t.dataset.anredeFor !== undefined) {
    saveAnrede(t.dataset.anredeFor, t.value);
    toast(t.value ? `Anrede: ${t.value}` : "Anrede zurückgesetzt");
    render();
  }
  else if (t.dataset.export) { state.exp[t.dataset.export] = t.checked; persist(); render(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "f-q") { state.filters.q = t.value; renderList(); }
  else if (t.dataset.noteFor) {
    state.drafts[t.dataset.noteFor] = t.value;
    const btn = t.closest(".note-box").querySelector('[data-act="save-note"]'); if (btn) btn.disabled = false;
  }
  else if (t.id === "import-json") state.importText = t.value;
  else if (t.dataset.abs) {
    state.absDraft = state.absDraft || { ...absStored() };
    state.absDraft[t.dataset.abs] = t.value;
    const b = document.querySelector('[data-act="abs-save"]'); if (b) b.disabled = false;
  }
  else if (t.id === "mv-betreff" || t.id === "mv-text" || t.id === "mv-angebot") {
    state.mvDraft = state.mvDraft || mailTpl();
    state.mvDraft[{ "mv-text": "text", "mv-angebot": "angebot", "mv-betreff": "betreff" }[t.id]] = t.value;
    const b = document.querySelector('[data-act="mv-save"]'); if (b) b.disabled = false;
    const g = state.loaded.projects ? [...groups().list].sort((x, y) => y.berater.length - x.berater.length || (y.best ?? -1) - (x.best ?? -1))[0] : null;
    const pv = document.getElementById("mv-preview"); if (g && pv) pv.textContent = mailFor(g, state.mvDraft).body;
  }
});

/* ---------- boot ---------- */
render();
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) { state.dbState = "missing"; render(); return; }
  state.db = db; state.dbState = "ready"; render();
  const onErr = (e) => { if (e && e.code === "revoked") { state.db = null; state.dbState = "missing"; render(); } };
  db.collection("recherchen").limit(1000).onSnapshot((snap) => {
    state.runs = snap.docs.map((d) => ({ ...d.data(), id: d.id })); state.loaded.runs = true; G = null; render();
  }, onErr);
  db.collection("projekte").limit(1000).onSnapshot((snap) => {
    state.projects = snap.docs.map((d) => ({ ...d.data(), id: d.id })); state.loaded.projects = true; G = null; render();
  }, onErr);
  db.collection("status").limit(1000).onSnapshot((snap) => {
    const m = {}; snap.docs.forEach((d) => { m[d.id] = d.data(); }); state.status = m; render();
  }, onErr);
  db.doc("meta/anbindung").onSnapshot((d) => { state.meta = d.exists ? d.data() : {}; if (state.tab === "einstellungen") render(); }, onErr);
  db.doc("meta/mailvorlage").onSnapshot((d) => { state.mailTpl = d.exists ? d.data() : {}; render(); }, onErr);
  db.doc("meta/absender").onSnapshot((d) => { state.absender = d.exists ? d.data() : {}; render(); }, onErr);
  db.doc("meta/anreden").onSnapshot((d) => {
    const m = {}; arr(d.exists && d.data().eintraege).forEach((x) => { if (x && x.name && (x.anrede === "Herr" || x.anrede === "Frau")) m[String(x.name)] = x.anrede; });
    state.anreden = m; render();
  }, onErr);
  try {
    const user = await window.claude.use("user");
    if (user) {
      const me = await user.me(); state.meName = me.name || "";
      if (!me.canEdit) state.canWrite = false;
      render();
    }
  } catch (e) {}
})();
})();
</script>
